name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mp]"

      - name: Run tests
        run: python -m pytest -q

      - name: Regenerate results end to end
        run: python -m tsadharness.cli run --out /tmp/ci-results --quiet

      - name: Verify every artifact was written
        run: |
          for f in sweep.csv false_positives.csv controls.csv ramp_ceiling.csv \
                   magnitude_sweep.png false_positive_rates.png SUMMARY.md; do
            test -s "/tmp/ci-results/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "all artifacts present"

      - name: Upload results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: tsad-harness-results
          path: /tmp/ci-results

  no-stumpy:
    name: pytest without the optional detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The matrix-profile detector is import-guarded. This job proves the
      # suite still passes when stumpy is absent, rather than assuming it.
      - name: Install without the mp extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
